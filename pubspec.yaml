name: terrace_garden
description: "Terrace and balcony garden planner and care companion."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Code-generation packages are pinned exactly: freezed, drift_dev and the
# riverpod generator/lint must agree on one analyzer major. These are the newest
# versions that resolve together on Flutter 3.44 (see ADR-001). Upgrade them
# together with the SDK.
dependencies:
  archive: ^4.5.2
  cupertino_icons: ^1.0.8
  drift: 2.31.0
  drift_flutter: 0.2.8
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_local_notifications: ^22.3.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.2.1
  flutter_timezone: ^5.1.1
  freezed_annotation: ^3.1.0
  go_router: ^18.1.0
  image_picker: ^1.2.4
  intl: ^0.20.2
  json_annotation: 4.11.0
  material_symbols_icons: ^4.2960.0
  meta: ^1.18.0
  path: ^1.9.1
  path_provider: ^2.1.6
  riverpod_annotation: 4.0.2
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  timezone: ^0.11.2
  uuid: ^4.6.0

dev_dependencies:
  alchemist: 0.14.0
  build_runner: ^2.15.1
  drift_dev: 2.31.0
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  freezed: 3.2.5
  integration_test:
    sdk: flutter
  json_serializable: 6.13.0
  mocktail: ^1.0.5
  riverpod_generator: 4.0.3
  shared_preferences_platform_interface: ^2.4.2
  very_good_analysis: 10.3.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Font licences, registered with LicenseRegistry at startup.
    - assets/fonts/Inter-OFL.txt
    - assets/fonts/Fraunces-OFL.txt
    - assets/images/photos/
    # Sourced plant catalogue (ADR-021); validated by catalogue_test.
    - assets/catalogue/

  # Bundled so typography works offline (ADR-012). SIL Open Font License 1.1.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter_18pt-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_18pt-SemiBold.ttf
          weight: 600
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces_72pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/Fraunces_72pt-SemiBold.ttf
          weight: 600
