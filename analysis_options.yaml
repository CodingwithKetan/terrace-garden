include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/l10n/app_localizations*.dart"
    # Generated by `dart run drift_dev make-migrations`; regenerated on schema changes.
    - "test/drift/**"

linter:
  rules:
    # App code, not a published package: API docs on every public member add noise.
    public_member_api_docs: false
    # Single-method interfaces (Clock, IdGenerator, AppLogger) are deliberate
    # dependency-injection seams for testing (ADR-018), not accidental classes.
    one_member_abstracts: false
