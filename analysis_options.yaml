include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/l10n/app_localizations*.dart"

linter:
  rules:
    # App code, not a published package: API docs on every public member add noise.
    public_member_api_docs: false

